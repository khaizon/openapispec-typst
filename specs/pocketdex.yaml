    SpeciesDetail:
      allOf:
        - $ref: '#/components/schemas/SpeciesSummary'
        - type: object
          required: [description, heightM, weightKg, abilities]
          properties:
            description:
              type: string
              description: Natural-history description.
              example: A small fox-like species that stores warmth in its tail.
            heightM:
              type: number
              format: float
              description: Height in metres.
              example: 0.6
            weightKg:
              type: number
              format: float
              description: Weight in kilograms.
              example: 7.4
            abilities:
              type: array
              description: Known abilities.
              items:
                type: string
              example: [Kindle, Warm Coat]
            stats:
              $ref: '#/components/schemas/SpeciesStats'
    SpeciesPage:
      type: object
      description: Paginated species list.
      required: [items, pagination]
      properties:
        items:
          type: array
          description: Species on this page.
          items:
            $ref: '#/components/schemas/SpeciesSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
    SpeciesResponse:
      type: object
      description: Response wrapper for a species detail.
      properties:
        data:
          $ref: '#/components/schemas/SpeciesDetail'
    SpeciesSummaryList:
      type: object
      description: Simple species list.
      properties:
        items:
          type: array
          description: Matching species.
          items:
            $ref: '#/components/schemas/SpeciesSummary'
    TypeEffectiveness:
      type: object
      description: Effectiveness multipliers keyed by attacking type.
      additionalProperties:
        type: number
        format: float
    EncounterMember:
      type: object
      description: A species observed during a party encounter.
      required: [speciesId, level]
      properties:
        speciesId:
          type: string
          description: Species identifier.
          example: spc_aquafin
        level:
          type: integer
          minimum: 1
          maximum: 100
          description: Observed level.
          example: 11
    SingleEncounterRequest:
      type: object
      description: Record one wild encounter.
      required: [speciesId, level, location]
      properties:
        speciesId:
          type: string
          description: Species identifier.
          example: spc_emberling
        level:
          type: integer
          minimum: 1
          maximum: 100
          description: Observed level.
          example: 12
        location:
          type: string
          description: Free-text location label.
          example: Ember Cavern
    PartyEncounterRequest:
      type: object
      description: Record an encounter involving multiple species.
      required: [members, location]
      properties:
        members:
          type: array
          description: Observed party members.
          minItems: 2
          items:
            $ref: '#/components/schemas/EncounterMember'
        location:
          type: string
          description: Free-text location label.
          example: Mistwood
    RouteEncounterRequest:
      type: object
      description: Record a route sweep.
      required: [routeId, count, location]
      properties:
        routeId:
          type: string
          description: Route identifier.
          example: rte_west_meadow
        count:
          type: integer
          minimum: 1
          maximum: 50
          description: Number of encounters to record.
          example: 5
        location:
          type: string
          description: Free-text location label.
          example: Sunlit Meadow
    AcceptedOrder:
      type: object
      description: Order accepted for asynchronous processing.
      required: [orderId, status]
      properties:
        orderId:
          type: string
          description: Order identifier used for polling.
          example: ord_demo_0001
        status:
          $ref: '#/components/schemas/EncounterStatus'
        estimatedAt:
          type: string
          format: date-time
          description: Estimated completion timestamp.
          example: '2026-04-01T10:00:05Z'
    EncounterOrder:
      type: object
      description: Current state of an encounter order.
      required: [orderId, status, submittedAt]
      properties:
        orderId:
          type: string
          description: Order identifier.
          example: ord_demo_0001
        status:
          $ref: '#/components/schemas/EncounterStatus'
        submittedAt:
          type: string
          format: date-time
          description: Submission timestamp.
          example: '2026-04-01T10:00:00Z'
        result:
          type: object
          description: Optional result payload once processing completes.
          properties:
            encountered:
              type: integer
              description: Number of encounters recorded.
              example: 3
    EncounterOrderResponse:
      type: object
      description: Response wrapper for an encounter order.
      properties:
        orderId:
          type: string
          description: Order identifier.
          example: ord_demo_0001
        status:
          $ref: '#/components/schemas/EncounterStatus'
        submittedAt:
          type: string
          format: date-time
          description: Submission timestamp.
          example: '2026-04-01T10:00:00Z'
        result:
          type: object
          description: Optional result payload.
          properties:
            encountered:
              type: integer
              description: Number of encounters recorded.
              example: 3
    Habitat:
