        special:
          type: integer
          description: Base special attack.
          example: 55
        total:
          type: integer
          description: Sum of all base stats.
          example: 265
    V2SpeciesStatsResponse:
      type: object
      description: Response wrapper for species stats with revision metadata.
      properties:
        hp:
          type: integer
          description: Base HP.
          example: 45
        attack:
          type: integer
          description: Base attack.
          example: 60
        defense:
          type: integer
          description: Base defense.
          example: 40
        speed:
          type: integer
          description: Base speed.
          example: 65
        special:
          type: integer
          description: Base special attack.
          example: 55
        total:
          type: integer
          description: Sum of all base stats.
