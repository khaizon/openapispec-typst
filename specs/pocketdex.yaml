          type: string
          description: Balance revision identifier.
          example: r7
        updatedAt:
          type: string
          format: date-time
          description: Last balance update.
          example: '2026-03-01T00:00:00Z'
    SpeciesStatsResponse:
      type: object
      description: Response wrapper for species stats.
      properties:
        hp:
          type: integer
          description: Base HP.
          example: 45
        attack:
          type: integer
          description: Base attack.
