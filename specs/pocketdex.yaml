          minimum: 0
          maximum: 1
          description: Compatibility score.
          example: 0.72
    BreedingPairList:
      type: object
      description: List of breeding pairs.
      properties:
        items:
          type: array
          description: Matching pairs.
          items:
            $ref: '#/components/schemas/BreedingPair'
