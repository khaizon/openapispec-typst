        name:
          type: string
          description: Habitat name.
          example: Sunlit Meadow
        climate:
          $ref: '#/components/schemas/HabitatClimate'
        children:
          type: array
          description: Nested sub-habitats.
          items:
            $ref: '#/components/schemas/Habitat'
    HabitatListResponse:
      type: object
      description: Habitats belonging to a region.
      properties:
        regionId:
          type: string
          description: Region identifier.
          example: reg_lumen
        items:
          type: array
          description: Habitats in the region.
          items:
            $ref: '#/components/schemas/Habitat'
    Region:
      type: object
      description: A PocketDex region.
      required: [regionId, name, generation]
      properties:
        regionId:
          type: string
          description: Stable region identifier.
          example: reg_lumen
        name:
          type: string
          description: Public region name.
          example: Lumen Vale
        generation:
          $ref: '#/components/schemas/RegionGeneration'
        habitats:
          type: array
          description: Habitats in the region.
          items:
            $ref: '#/components/schemas/Habitat'
    Item:
      type: object
      description: An item in the catalogue.
      required: [itemId, name, category, cost]
      properties:
        itemId:
          type: string
          description: Stable item identifier.
          example: itm_glow_salve
        name:
          type: string
          description: Item name.
          example: Glow Salve
        category:
          $ref: '#/components/schemas/ItemCategory'
        cost:
          type: integer
          minimum: 0
          description: Cost in Pocket Coins.
          example: 320
        description:
          type: string
          description: Item description.
          example: Restores a small amount of health.
    ItemPage:
      type: object
      description: Paginated item list.
      required: [items, pagination]
      properties:
        items:
          type: array
          description: Items on this page.
          items:
            $ref: '#/components/schemas/Item'
        pagination:
          $ref: '#/components/schemas/Pagination'
    BreedingPair:
      type: object
      description: A compatible breeding pair.
      required: [speciesA, speciesB]
      properties:
        speciesA:
          type: string
          description: First species identifier.
          example: spc_emberling
        speciesB:
          type: string
          description: Second species identifier.
          example: spc_aquafin
        compatibility:
          type: number
